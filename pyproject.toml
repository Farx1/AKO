[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ako"
version = "0.2.0"
description = "Adaptive Kernel Optimizer — automatic GPU kernel selection for LLM inference blocks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jules Barth" }]
keywords = ["cuda", "triton", "llm", "inference", "kernels", "autotuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.5",
    "rich>=13.7",
    "torch>=2.2",
]

[project.urls]
Homepage = "https://github.com/Farx1/AKO"
Repository = "https://github.com/Farx1/AKO"
Issues = "https://github.com/Farx1/AKO/issues"
Changelog = "https://github.com/Farx1/AKO/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gpu = ["triton>=3.0"]
hf = ["transformers>=4.40"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
all = ["ako[gpu,hf,dev]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ako*"]

[tool.setuptools.package-data]
ako = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA GPU",
    "slow: long-running benchmark",
]
