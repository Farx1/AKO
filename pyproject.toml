[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ako"
version = "0.2.0"
description = "Adaptive Kernel Optimizer — automatic GPU kernel selection for LLM inference blocks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jules Barth" }]
keywords = ["cuda", "triton", "llm", "inference", "kernels", "autotuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.5",
    "rich>=13.7",
    "torch>=2.2",
]

[project.urls]
Homepage = "https://github.com/Farx1/AKO"
Repository = "https://github.com/Farx1/AKO"
Issues = "https://github.com/Farx1/AKO/issues"
Changelog = "https://github.com/Farx1/AKO/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gpu = ["triton>=3.0"]
hf = ["transformers>=4.40"]
dev = ["pytest>=8.0", "matplotlib>=3.8", "hypothesis>=6.100"]
# Quality gates run in CI (coverage, type check, pre-commit hooks).
ci = ["pytest-cov>=5.0", "mypy>=1.10", "pre-commit>=3.7"]
all = ["ako[gpu,hf,dev]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ako*"]

[tool.setuptools.package-data]
ako = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import helpers from scripts/ (e.g. scripts.winnable_region).
pythonpath = ["."]
markers = [
    "gpu: requires CUDA GPU",
    "slow: long-running benchmark",
]

[tool.coverage.run]
source = ["ako"]

[tool.coverage.report]
# CPU suite only; Triton kernel bodies and CUDA paths are not reachable here.
# Set to the measured CPU coverage rounded down. Raise it, never lower it.
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Errors only (pyflakes + syntax). Style rules can be widened file by file later.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
# Progressive: packages listed here type-check clean today. ako/benchmark,
# ako/ops, ako/models and ako/search still have errors (38 at the time of
# writing) and join the list once fixed.
files = ["ako/dispatcher", "ako/validation", "ako/export", "ako/experiments"]
